[package]
name = "semantic-python"
description = "Native Python boundary for semantic-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
semantic-core = { path = "../../crates/semantic-core" }
pyo3 = { version = "=0.29.3", features = ["abi3-py312"] }
