name: Python wheels

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            label: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path bindings/python/Cargo.toml --release --locked -i python3.12 --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        platform:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.11"
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.label }}
          path: dist
      - run: uv run --no-project --python "${{ matrix.python }}" python bindings/python/verify_wheel.py --wheel dist/*.whl --python "${{ matrix.python }}"

  source:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.11'
          python-version: '3.12'
      - run: cargo fetch --locked
      - run: uv sync --project bindings/python --locked --no-install-project --python 3.12
      - run: bindings/python/.venv/bin/maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
      - run: python bindings/python/check.py --sdist dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [install, source]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/release_version.py "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-source
          path: dist
      - name: Check which artifacts still need publishing
        id: pending
        run: |
          pending=$(python3 scripts/pending_wheels.py "${GITHUB_REF_NAME#v}" dist)
          echo "publish=$pending" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        if: steps.pending.outputs.publish == 'true'

  published-install:
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Grade from PyPI
        run: |
          consumer=$(mktemp -d)
          cp bindings/python/examples/grade_response.py "$consumer/"
          cd "$consumer"
          python -m venv environment
          environment/bin/python -m pip install --only-binary=:all: "genius-bench-kernel==${GITHUB_REF_NAME#v}"
          scores=$(environment/bin/python -I grade_response.py)
          test "$scores" = $'correctness true\nscope false'
