name: Rust crate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo package --locked --package genius-bench-kernel
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: Grade from the packaged crate
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: |
          version=$(python3 scripts/release_version.py)
          crate="$PWD/target/package/genius-bench-kernel-${version#v}"
          bash scripts/verify_crate.sh genius-bench-kernel --path "$crate"

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/release_version.py "$GITHUB_REF_NAME"
      - name: Check crate bootstrap configuration
        id: bootstrap
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [[ -n "$CRATES_IO_BOOTSTRAP_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.bootstrap.outputs.enabled != 'true'
        id: auth
      - run: cargo publish --locked --no-verify --package genius-bench-kernel
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CRATES_IO_BOOTSTRAP_TOKEN }}

  published-install:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/verify_crate.sh "genius-bench-kernel@=${GITHUB_REF_NAME#v}"
