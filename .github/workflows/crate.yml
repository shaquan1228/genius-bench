name: Rust crate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo package --locked --package genius-bench-kernel
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: Grade from the packaged crate
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: |
          version=$(python3 scripts/release_version.py)
          crate="$PWD/target/package/genius-bench-kernel-${version#v}"
          bash scripts/verify_install.sh rust "${version#v}" "$crate"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/release_version.py "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate
          path: dist
      - name: Check the tested crate against crates.io
        id: pending
        run: |
          publish=$(python3 scripts/stage_release.py crates-io "${GITHUB_REF_NAME#v}" dist pending)
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Confirm Cargo reproduces the tested archive
        if: steps.pending.outputs.publish == 'true'
        run: |
          cargo package --locked --no-verify --package genius-bench-kernel
          cmp pending/*.crate target/package/*.crate
      - name: Check crate bootstrap configuration
        if: steps.pending.outputs.publish == 'true'
        id: bootstrap
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [[ -n "$CRATES_IO_BOOTSTRAP_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
        if: steps.pending.outputs.publish == 'true' && steps.bootstrap.outputs.enabled != 'true'
        id: auth
      - if: steps.pending.outputs.publish == 'true'
        run: cargo publish --locked --no-verify --package genius-bench-kernel
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CRATES_IO_BOOTSTRAP_TOKEN }}

  published-install:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/verify_install.sh rust "${GITHUB_REF_NAME#v}"
