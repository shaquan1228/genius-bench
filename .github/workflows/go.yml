name: Go module

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  MODULE_PATH: bindings/go/genius-bench-kernel

jobs:
  archive:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux_amd64
          - os: macos-15
            platform: darwin_arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - run: |
          cargo build --locked --release --manifest-path bindings/go/native/Cargo.toml --target-dir target
          mv target/release/libgenius_bench_go.a "libgenius_bench_go_${PLATFORM}.a"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: go-archive-${{ matrix.platform }}
          path: libgenius_bench_go_*.a
          if-no-files-found: error

  module:
    needs: archive
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
      object: ${{ steps.package.outputs.object }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: go-archive-*
          path: bindings/go/genius-bench-kernel
          merge-multiple: true
      - name: Package the tagged Go module
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(python3 scripts/release_version.py)
          object=$(bash scripts/package_go_module.sh "$MODULE_PATH" "$version" "$RUNNER_TEMP/go.bundle" "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "object=$object" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: go-module
          path: ${{ runner.temp }}/go.bundle
          if-no-files-found: error

  install:
    needs: module
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.module.outputs.version }}
      MODULE_OBJECT: ${{ needs.module.outputs.object }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/genius-bench-kernel/go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: go-module
          path: ${{ runner.temp }}
      - run: |
          ref="refs/tags/$MODULE_PATH/$VERSION"
          git fetch --no-tags "$RUNNER_TEMP/go.bundle" "+$ref:$ref"
          test "$(git rev-parse "$ref")" = "$MODULE_OBJECT"
          python3 bindings/go/verify_module.py "$VERSION" --repository "$PWD"

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [module, install]
    runs-on: ubuntu-24.04
    environment: go-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.module.outputs.version }}
      MODULE_OBJECT: ${{ needs.module.outputs.object }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: go-module
          path: ${{ runner.temp }}
      - run: |
          ref="refs/tags/$MODULE_PATH/$VERSION"
          git fetch --no-tags "$RUNNER_TEMP/go.bundle" "$ref"
          test "$(git rev-parse FETCH_HEAD)" = "$MODULE_OBJECT"
          git push origin "$MODULE_OBJECT:$ref"

  published-install:
    needs: [module, publish]
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.module.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/genius-bench-kernel/go.mod
          cache: false
      - run: python3 bindings/go/verify_module.py "$VERSION"
