name: Core and Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.11"
          python-version: "3.12"
      - run: rustup show active-toolchain
      - run: cargo fetch --locked
      - run: uv sync --project bindings/python --locked --no-install-project --python 3.12
      - run: make check
